<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" fill="none">
  <defs>
    <filter id="cueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g opacity="0.98" filter="url(#cueGlow)">
    <!-- loose hand-drawn spiral -->
    <path
      d="M76 46 C42 45 17 67 22 96 C27 126 61 145 98 139 C132 133 151 108 139 82 C128 58 96 52 69 62 C47 70 43 91 54 106 C66 122 91 119 100 102 C108 87 99 73 84 75 C70 76 65 89 72 100"
      stroke="#e8f6ff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-dasharray="5 8"
    />

    <!-- scroll arrow: leaves the spiral and deliberately travels downward -->
    <path
      d="M72 100 C77 118 84 136 96 151 C107 165 118 178 124 193"
      stroke="#ffd76b"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- arrowhead: tip is directly below the shaft, pointing DOWN -->
    <path
      d="M114 184 L124 196 L134 184"
      stroke="#ffd76b"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- destination target remains a separate decorative destination cue -->
    <circle cx="247" cy="181" r="29" stroke="#ffd76b" stroke-width="3.5"/>
    <circle cx="247" cy="181" r="18" stroke="#ffd76b" stroke-width="2.8" stroke-dasharray="5 6"/>
    <circle cx="247" cy="181" r="5.5" fill="#fff3bc"/>
    <path d="M247 138 L247 148 M247 214 L247 224 M204 181 L214 181 M280 181 L290 181" stroke="#fff3bc" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M219 152 L212 145 M275 152 L282 145 M219 210 L212 217 M275 210 L282 217" stroke="#ffd76b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- small hand-drawn accents -->
    <path d="M292 126 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#ffd76b"/>
    <path d="M287 207 l3 6 7 1 -5 5 1 7 -6 -4 -6 4 1 -7 -5 -5 7 -1z" fill="#dff4ff"/>
  </g>

  <!-- handwritten-style lettering -->
  <text x="145" y="62" fill="#f8fcff" font-size="39" font-family="cursive" font-style="italic" font-weight="700" transform="rotate(-7 145 62)">Scroll</text>
  <text x="173" y="91" fill="#ffd76b" font-size="21" font-family="cursive" font-style="italic" font-weight="700" transform="rotate(-6 173 91)">to explore</text>
</svg>
